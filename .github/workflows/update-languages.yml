name: Update README Stats

on:
  workflow_dispatch:

  push:
    branches:
      - main

  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Setup Python
      # ---------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---------------------------------------------------------
      # 3. Install Python dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        run: pip install requests

      # ---------------------------------------------------------
      # 4. Update language percentages in README
      # ---------------------------------------------------------
      - name: Update language percentages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_languages.py

      # ---------------------------------------------------------
      # 5. Directory for generated SVG cards
      # ---------------------------------------------------------
      - name: Create profile directory
        run: mkdir -p profile

      # ---------------------------------------------------------
      # 6. Generate GitHub Stats card
      # ---------------------------------------------------------
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # 7. Generate Top Languages card
      # ---------------------------------------------------------
      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # 8. Commit everything
      # ---------------------------------------------------------
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md profile/*.svg

          git diff --staged --quiet || git commit -m "Update README statistics"
          git push
